[versions]
material = "1.11.0"
splashscreen = "1.0.1"
agp                   = "8.6.1"
kotlin                = "2.0.20"
ksp                   = "2.0.20-1.0.25"

coreKtx               = "1.13.1"
lifecycleRuntimeKtx   = "2.8.6"
activityCompose       = "1.9.2"
composeBom            = "2024.09.03"
navigationCompose     = "2.8.2"

room                  = "2.6.1"

hilt                  = "2.52"
hiltNavigationCompose = "1.2.0"

coroutines            = "1.8.1"
datastore             = "1.1.1"
coil                  = "2.7.0"
workManager           = "2.9.1"
biometric             = "1.2.0-alpha05"
securityCrypto        = "1.1.0-alpha06"
gson                  = "2.11.0"
timber                = "5.0.1"

junit                 = "4.13.2"
junitExt              = "1.2.1"
espresso              = "3.7.0"
coroutinesTest        = "1.8.1"

firebaseBom           = "33.5.1"
googleServices        = "4.4.2"


[libraries]
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

# ── AndroidX Core ────────────────────────────────────────────────────────────

androidx-core-ktx                    = { group = "androidx.core",             name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",        version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",  version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose            = { group = "androidx.activity",         name = "activity-compose",             version.ref = "activityCompose" }


# ── Compose BOM + Artifacts ─────────────────────────────────────────────────

androidx-compose-bom                 = { group = "androidx.compose",          name = "compose-bom",                  version.ref = "composeBom" }
androidx-compose-ui                  = { group = "androidx.compose.ui",       name = "ui" }
androidx-compose-ui-graphics         = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-compose-ui-tooling-preview  = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
androidx-compose-ui-tooling          = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-compose-ui-test-junit4      = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons      = { group = "androidx.compose.material", name = "material-icons-extended" }


# ── Navigation ──────────────────────────────────────────────────────────────

androidx-navigation-compose          = { group = "androidx.navigation",       name = "navigation-compose",           version.ref = "navigationCompose" }


# ── Room ────────────────────────────────────────────────────────────────────

androidx-room-runtime                = { group = "androidx.room",             name = "room-runtime",                 version.ref = "room" }
androidx-room-ktx                    = { group = "androidx.room",             name = "room-ktx",                     version.ref = "room" }
androidx-room-compiler               = { group = "androidx.room",             name = "room-compiler",                version.ref = "room" }
androidx-room-testing                = { group = "androidx.room",             name = "room-testing",                 version.ref = "room" }


# ── Hilt ────────────────────────────────────────────────────────────────────

hilt-android                         = { group = "com.google.dagger",          name = "hilt-android",                 version.ref = "hilt" }
hilt-compiler                        = { group = "com.google.dagger",          name = "hilt-android-compiler",         version.ref = "hilt" }
androidx-hilt-navigation-compose     = { group = "androidx.hilt",             name = "hilt-navigation-compose",       version.ref = "hiltNavigationCompose" }
androidx-hilt-work                   = { group = "androidx.hilt",             name = "hilt-work",                     version.ref = "hiltNavigationCompose" }
androidx-hilt-compiler               = { group = "androidx.hilt",             name = "hilt-compiler",                 version.ref = "hiltNavigationCompose" }


# ── Coroutines ──────────────────────────────────────────────────────────────

kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",   version.ref = "coroutines" }
kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",      version.ref = "coroutinesTest" }


# ── DataStore ───────────────────────────────────────────────────────────────

androidx-datastore-preferences       = { group = "androidx.datastore",        name = "datastore-preferences",        version.ref = "datastore" }


# ── Coil ────────────────────────────────────────────────────────────────────

coil-compose                         = { group = "io.coil-kt",                name = "coil-compose",                 version.ref = "coil" }


# ── WorkManager ─────────────────────────────────────────────────────────────

androidx-work-runtime-ktx            = { group = "androidx.work",             name = "work-runtime-ktx",             version.ref = "workManager" }


# ── Biometric ───────────────────────────────────────────────────────────────

androidx-biometric                   = { group = "androidx.biometric",        name = "biometric",                   version.ref = "biometric" }


# ── Security Crypto ─────────────────────────────────────────────────────────

androidx-security-crypto             = { group = "androidx.security",         name = "security-crypto",             version.ref = "securityCrypto" }


# ── Gson ────────────────────────────────────────────────────────────────────

gson                                 = { group = "com.google.code.gson",      name = "gson",                       version.ref = "gson" }


# ── Timber ──────────────────────────────────────────────────────────────────

timber                               = { group = "com.jakewharton.timber",    name = "timber",                     version.ref = "timber" }


# ── Tests ───────────────────────────────────────────────────────────────────

junit                                = { group = "junit",                     name = "junit",                     version.ref = "junit" }
androidx-test-ext-junit              = { group = "androidx.test.ext",         name = "junit",                     version.ref = "junitExt" }
androidx-espresso-core               = { group = "androidx.test.espresso",    name = "espresso-core",             version.ref = "espresso" }


# ── Firebase ─────────────────────────────────────────────────────────────────

firebase-bom                         = { group = "com.google.firebase",       name = "firebase-bom",              version.ref = "firebaseBom" }
firebase-auth-ktx                    = { group = "com.google.firebase",       name = "firebase-auth-ktx" }
firebase-firestore-ktx               = { group = "com.google.firebase",       name = "firebase-firestore-ktx" }
firebase-messaging-ktx               = { group = "com.google.firebase",       name = "firebase-messaging-ktx" }


[plugins]

android-application  = { id = "com.android.application",             version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-kapt          = { id = "org.jetbrains.kotlin.kapt",            version.ref = "kotlin" }

# KSP
ksp                  = { id = "com.google.devtools.ksp",             version.ref = "ksp" }

# Room Gradle Plugin
androidx-room        = { id = "androidx.room",                       version.ref = "room" }

hilt-android         = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services      = { id = "com.google.gms.google-services",       version.ref = "googleServices" }
